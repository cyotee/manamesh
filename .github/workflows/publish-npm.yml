name: npm release moved to manamesh-games

# The platform submodule cannot install root workspace games or build the SPA.
# Releases are explicitly dispatched from the monorepo after full validation.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-location:
    runs-on: ubuntu-latest
    steps:
      - name: Report the supported release path
        run: |
          echo 'Use release-manamesh.yml in cyotee/manamesh-games.'
          echo 'It builds the monorepo, validates the installed package, and publishes the same tarball.'
          exit 1
